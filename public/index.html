<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">
        <!-- Photo Stack Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <rect x="3" y="7" width="14" height="10" rx="2" stroke-width="2"/>
          <rect x="7" y="3" width="14" height="10" rx="2" stroke-width="2" opacity="0.6"/>
        </svg>
      </div>

      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html" class="text-[#C76B4A] font-semibold">Home</a>
      <a href="upload.html" class="hover:text-[#C76B4A]">Upload</a>
      <a href="gallery.html" class="hover:text-[#C76B4A]">Gallery</a>
      <a href="profile.html" class="hover:text-[#C76B4A]">My Uploads</a>
      <button onclick="logout()" class="text-red-500 hover:text-red-600 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">

  <section class="mb-8 text-center">
    <h2 class="text-2xl md:text-3xl font-semibold mb-4">
      Your memories, your rules. Upload and manage your gallery anytime.
    </h2>

    <div class="flex justify-center gap-4">
      <a href="upload.html" class="px-5 py-2.5 bg-[#C76B4A] text-white rounded-lg hover:opacity-90">
        Upload
      </a>
      <a href="gallery.html" class="px-5 py-2.5 bg-[#8FA996] text-white rounded-lg hover:opacity-90">
        Gallery
      </a>
    </div>
  </section>

  <section class="mb-10 text-center">
    <p class="inline-flex flex-wrap justify-center items-center gap-x-4 gap-y-1 text-sm text-gray-600 bg-white border border-[#E8DED2] rounded-full px-5 py-2 shadow-sm">
      <span>Media: <span id="totalCount" class="font-semibold text-[#1F2933]">0</span></span>
      <span class="text-gray-300">|</span>
      <span>Albums: <span id="albumCount" class="font-semibold text-[#1F2933]">0</span></span>
      <span class="text-gray-300">|</span>
      <span>Recent: <span id="recentCount" class="font-semibold text-[#1F2933]">0</span></span>
    </p>
  </section>

  <section>
    <h3 class="text-lg font-semibold mb-4">Recent Media</h3>
    <div id="recentPhotos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </section>

</main>

<div class="fixed bottom-5 left-5 z-40 hidden md:flex items-center gap-3 bg-white border border-[#E8DED2] rounded-xl shadow-lg p-3 max-w-xs">
  <img
    src="/images/grandpa.png"
    alt="Fam Media Grandpa"
    class="w-12 h-12 rounded-lg object-cover flex-shrink-0"
  >

  <div>
    <p id="dailyMessage" class="text-xs leading-snug text-[#1F2933] font-medium">
      Loading...
    </p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="scripts/shared.js"></script>
<script src="scripts/home.js"></script>

</body>
</html>
