<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">
        📷
      </div>
      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html">Home</a>
      <a href="upload.html">Upload</a>
      <a href="gallery.html" class="text-[#C76B4A] font-semibold">Gallery</a>
      <a href="profile.html">My Uploads</a>
      <button onclick="logout()" class="text-red-500 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">

  <!-- HEADER + ACTIONS -->
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">

    <div>
      <h1 id="galleryTitle" class="text-2xl font-bold">Family Hub</h1>
      <p class="text-sm text-gray-500 mt-1">Recent family moments</p>
      <p class="text-sm text-gray-500 mt-1" id="photoCount">Loading...</p>
    </div>

    <div class="flex gap-3">

      <select
        id="albumFilter"
        class="px-4 py-2.5 bg-white border border-[#E8DED2] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
        <option value="">All Albums</option>
      </select>

      <button
        id="refreshGalleryBtn"
        class="px-4 py-2.5 bg-[#8FA996] text-white rounded-lg text-sm hover:opacity-90"
      >
        Refresh
      </button>

    </div>

  </div>

  <div id="familyMembers" class="mb-8">
    <h2 class="text-lg font-semibold mb-3">Browse by Family Member</h2>
    <div id="familyMembersGrid" class="flex flex-wrap gap-3"></div>
  </div>

  <div id="gallery"></div>

</main>

<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="scripts/shared.js"></script>
<script src="scripts/viewer.js"></script>
<script src="scripts/reactions.js"></script>
<script src="scripts/gallery.js"></script>

<script>
  // NEW: Refresh handler
  document.getElementById('refreshGalleryBtn')?.addEventListener('click', () => {
    if (typeof loadGallery === 'function') {
      loadGallery();
      showToast('Gallery refreshed');
    }
  });
</script>

</body>
</html>
