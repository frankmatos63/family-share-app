<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white/80 backdrop-blur border-b border-[#E8DED2] sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      <div class="w-11 h-11 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white text-xl">
        📷
      </div>
      <div>
        <h1 class="text-lg font-semibold">Fam Media</h1>
        <p class="text-xs text-gray-500">Capture what matters</p>
      </div>
    </a>

    <nav class="flex gap-2 text-sm items-center">
      <a href="index.html" class="px-4 py-2 rounded-xl hover:bg-[#F2EAE3]">Home</a>
      <a href="upload.html" class="px-4 py-2 rounded-xl hover:bg-[#F2EAE3]">Upload</a>
      <a href="gallery.html" class="px-4 py-2 rounded-xl bg-[#C76B4A] text-white">Gallery</a>
      <a href="profile.html" class="px-4 py-2 rounded-xl hover:bg-[#F2EAE3]">Profile</a>
      <button onclick="logout()" class="text-red-500 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-10">

  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-semibold">All Media</h1>
      <p class="text-sm text-gray-500 mt-1" id="photoCount">Loading...</p>
    </div>

    <select id="albumFilter" class="px-4 py-3 bg-white border border-[#E8DED2] rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#C76B4A]">
      <option value="">All Albums</option>
      <option value="Fam Media">Fam Media</option>
      <option value="Vacations">Vacations</option>
      <option value="Holidays">Holidays</option>
      <option value="Special Events">Special Events</option>
      <option value="Kids">Kids</option>
    </select>
  </div>

  <div id="gallery"></div>

</main>

<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="scripts.js"></script>

</body>
</html>
