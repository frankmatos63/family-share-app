<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">
        📷
      </div>
      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html" class="hover:text-[#C76B4A]">Home</a>
      <a href="upload.html" class="text-[#C76B4A] font-semibold">Upload</a>
      <a href="gallery.html" class="hover:text-[#C76B4A]">Gallery</a>
      <a href="profile.html" class="hover:text-[#C76B4A]">Profile</a>
      <button onclick="logout()" class="text-red-500 hover:text-red-600 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10">

  <div class="mb-8">
    <h1 class="text-3xl font-semibold mb-2">Upload Media</h1>
    <p class="text-gray-500">Add photos or videos to Fam Media</p>
  </div>

  <form id="uploadForm" class="space-y-6">

    <div id="dropZone" class="border border-dashed border-[#E8DED2] rounded-xl p-10 text-center bg-white hover:border-[#C76B4A] transition-all shadow-sm">

      <div class="w-14 h-14 mx-auto mb-4 bg-[#C76B4A] text-white rounded-full flex items-center justify-center text-2xl">
        ↑
      </div>

      <p class="text-lg mb-2">Drag & drop files here</p>
      <p class="text-sm text-gray-500 mb-2">or select manually</p>
      <p class="text-xs text-gray-500 mb-3">Maximum 25 files per upload</p>
      <p id="uploadLimitWarning" class="hidden text-sm text-red-500 mb-4">
        Please select 25 files or fewer.
      </p>

      <label class="inline-block px-5 py-2.5 bg-[#C76B4A] text-white rounded-lg cursor-pointer hover:opacity-90">
        Browse Files
        <input type="file" id="fileUpload" multiple accept="image/*,video/*" class="hidden">
      </label>

    </div>

    <div id="selectedFilesContainer" class="hidden">
      <div class="bg-white border border-[#E8DED2] rounded-xl p-4 shadow-sm">
        <h3 class="text-sm text-gray-500 mb-3">Selected Files</h3>
        <div id="fileList" class="space-y-2"></div>
      </div>
    </div>

    <div>
      <label class="text-sm text-gray-500 mb-2 block">Caption</label>
      <input
        type="text"
        id="title"
        placeholder="Add a short caption, optional"
        class="w-full px-4 py-2.5 border border-[#E8DED2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
    </div>

    <div>
      <label class="text-sm text-gray-500 mb-2 block">Album</label>
      <select
        id="album"
        class="w-full px-4 py-2.5 border border-[#E8DED2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
        <option value="">No album</option>
        <option value="Family">Family</option>
        <option value="Trips">Trips</option>
        <option value="Celebrations">Celebrations</option>
        <option value="Kids">Kids</option>
        <option value="Pets">Pets</option>
        <option value="Old Memories">Old Memories</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="flex gap-4 pt-4">
      <button
        id="uploadButton"
        type="submit"
        class="flex-1 px-5 py-2.5 bg-[#C76B4A] text-white rounded-lg hover:opacity-90"
      >
        Upload
      </button>

      <a
        href="index.html"
        class="px-5 py-2.5 border border-[#E8DED2] rounded-lg hover:bg-[#F2EAE3]"
      >
        Cancel
      </a>
    </div>

  </form>

</main>

<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="scripts.js"></script>

</body>
</html>
