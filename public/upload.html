<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">
        📷
      </div>
      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html">Home</a>
      <a href="upload.html" class="text-[#C76B4A] font-semibold">Upload</a>
      <a href="gallery.html">Gallery</a>
      <a href="profile.html">Profile</a>
      <button onclick="logout()" class="text-red-500 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-10">

  <div class="mb-8">
    <h1 class="text-3xl font-semibold mb-2">Upload Media</h1>
    <p class="text-gray-500">Add photos or videos</p>
  </div>

  <form id="uploadForm" class="space-y-6">

    <!-- DROP ZONE -->
    <div id="dropZone" class="border border-dashed border-[#E8DED2] rounded-xl p-10 text-center bg-white hover:border-[#C76B4A] transition-all shadow-sm">

      <div class="w-14 h-14 mx-auto mb-4 bg-[#C76B4A] text-white rounded-full flex items-center justify-center text-2xl">
        ↑
      </div>

      <p class="text-lg mb-2">Drag & drop files</p>
      <p class="text-sm text-gray-500 mb-2">or browse</p>
      <p class="text-xs text-gray-500 mb-3">Max 25 files</p>

      <p id="uploadLimitWarning" class="hidden text-sm text-red-500 mb-4">
        Max 25 files allowed
      </p>

      <label class="inline-block px-5 py-2.5 bg-[#C76B4A] text-white rounded-lg cursor-pointer">
        Browse Files
        <input type="file" id="fileUpload" multiple accept="image/*,video/*" class="hidden">
      </label>

    </div>

    <!-- FILE LIST -->
    <div id="selectedFilesContainer" class="hidden">
      <div class="bg-white border border-[#E8DED2] rounded-xl p-4 shadow-sm">
        <h3 class="text-sm text-gray-500 mb-3">Selected Files</h3>
        <div id="fileList" class="space-y-2"></div>
      </div>
    </div>

    <!-- CAPTION -->
    <div>
      <label class="text-sm text-gray-500 mb-2 block">Caption</label>
      <input
        type="text"
        id="title"
        placeholder="Optional"
        class="w-full px-4 py-2.5 border border-[#E8DED2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
    </div>

    <!-- ALBUM SELECT -->
    <div>
      <label class="text-sm text-gray-500 mb-2 block">Album</label>
      <select
        id="album"
        class="w-full px-4 py-2.5 border border-[#E8DED2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
        <option value="">Quick Upload / Misc</option>
      </select>
      <p class="text-xs text-gray-400 mt-1">Use existing album or create a new one below</p>
    </div>

    <!-- NEW ALBUM -->
    <div>
      <label class="text-sm text-gray-500 mb-2 block">Create new album</label>
      <input
        type="text"
        id="newAlbum"
        placeholder="e.g. Cruise 2026"
        class="w-full px-4 py-2.5 border border-[#E8DED2] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#C76B4A]"
      >
    </div>

    <!-- ACTIONS -->
    <div class="flex gap-4 pt-4">
      <button
        id="uploadButton"
        type="submit"
        class="flex-1 px-5 py-2.5 bg-[#C76B4A] text-white rounded-lg hover:opacity-90"
      >
        Upload
      </button>

      <a
        href="index.html"
        class="px-5 py-2.5 border border-[#E8DED2] rounded-lg hover:bg-[#F2EAE3]"
      >
        Cancel
      </a>
    </div>

  </form>

</main>

<script src="auth.js"></script>
<script>
  requireAuth();
</script>
<script src="scripts/shared.js"></script>
<script src="scripts/upload.js"></script>

</body>
</html>
