<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">
        📷
      </div>
      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html" class="hover:text-[#C76B4A]">Home</a>
      <a href="upload.html" class="hover:text-[#C76B4A]">Upload</a>
      <a href="gallery.html" class="hover:text-[#C76B4A]">Gallery</a>
      <a href="profile.html" class="text-[#C76B4A] font-semibold">Profile</a>
      <button onclick="logout()" class="text-red-500 hover:text-red-600 ml-2">Logout</button>
    </nav>

  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">

  <div class="bg-white rounded-xl shadow-sm border border-[#E8DED2] p-6 mb-8 flex items-center gap-5">
    <div class="w-16 h-16 bg-[#C76B4A] text-white rounded-full flex items-center justify-center text-2xl">
      👤
    </div>
    <div>
      <h2 id="usernameDisplay" class="text-2xl font-semibold">Loading...</h2>
      <p class="text-gray-500 text-sm">Fam Media</p>
    </div>
  </div>

  <div class="grid lg:grid-cols-3 gap-8">

    <div class="bg-white rounded-xl border border-[#E8DED2] p-4 h-fit shadow-sm">
      <nav class="space-y-2">

        <button onclick="showTab('uploads')" id="tabUploads"
          class="w-full text-left px-4 py-2.5 rounded-lg bg-[#C76B4A] text-white">
          My Uploads
        </button>

        <button onclick="showTab('settings')" id="tabSettings"
          class="w-full text-left px-4 py-2.5 rounded-lg hover:bg-[#F2EAE3] text-gray-700">
          Settings
        </button>

      </nav>
    </div>

    <div class="lg:col-span-2">

      <div id="contentUploads" class="tab-content">
        <div class="mb-6">
          <h1 class="text-2xl font-semibold">My Uploads</h1>
          <p class="text-sm text-gray-500" id="uploadStats">Loading...</p>
        </div>

        <div id="userUploads" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>

      <div id="contentSettings" class="tab-content hidden">
        <div class="bg-white border border-[#E8DED2] rounded-xl p-6 shadow-sm">
          <h1 class="text-2xl font-semibold mb-2">Settings</h1>
          <p class="text-sm text-gray-500">Settings will be added later.</p>
        </div>
      </div>

    </div>

  </div>

</main>

<script src="auth.js"></script>
<script>
  requireAuth();

  async function loadUser() {
    try {
      const res = await fetch('/api/me');
      const data = await res.json();

      if (data.loggedIn) {
        document.getElementById('usernameDisplay').textContent = data.user.username;
      }
    } catch (e) {
      console.error(e);
    }
  }

  loadUser();
</script>

<script src="scripts.js"></script>

<script>
function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('content' + capitalize(tab)).classList.remove('hidden');

  document.querySelectorAll('#tabUploads, #tabSettings').forEach(btn => {
    btn.classList.remove('bg-[#C76B4A]', 'text-white');
    btn.classList.add('text-gray-700');
  });

  const active = document.getElementById('tab' + capitalize(tab));
  active.classList.add('bg-[#C76B4A]', 'text-white');
  active.classList.remove('text-gray-700');
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}
</script>

</body>
</html>
