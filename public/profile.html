<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] text-[#1F2933]">

<header class="bg-white border-b border-[#E8DED2]">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
    <a href="index.html" class="flex items-center gap-3">
      <div class="w-10 h-10 bg-[#C76B4A] rounded-xl flex items-center justify-center text-white">📷</div>
      <h1 class="text-lg font-semibold">Fam Media</h1>
    </a>

    <nav class="flex items-center gap-3 text-sm">
      <a href="index.html">Home</a>
      <a href="upload.html">Upload</a>
      <a href="gallery.html">Gallery</a>
      <a href="profile.html" class="text-[#C76B4A] font-semibold">Profile</a>
      <button onclick="logout()" class="text-red-500 ml-2">Logout</button>
    </nav>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">

  <div class="bg-white rounded-xl border p-6 mb-8 flex items-center gap-5">
    <div class="w-16 h-16 bg-[#C76B4A] text-white rounded-full flex items-center justify-center text-2xl">👤</div>
    <div>
      <h2 id="usernameDisplay" class="text-2xl font-semibold">Loading...</h2>
    </div>
  </div>

  <div class="grid lg:grid-cols-3 gap-8">

    <div class="bg-white rounded-xl border p-4">
      <button onclick="showTab('uploads')" id="tabUploads"
        class="w-full text-left px-4 py-2 rounded bg-[#C76B4A] text-white">
        My Uploads
      </button>

      <button onclick="showTab('settings')" id="tabSettings"
        class="hidden w-full text-left px-4 py-2 mt-2 rounded">
        Settings
      </button>
    </div>

    <div class="lg:col-span-2">

      <div id="contentUploads">
        <div id="userUploads" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
      </div>

      <div id="contentSettings" class="hidden space-y-6">

        <div class="bg-white border rounded p-6">
          <h2 class="text-lg font-semibold mb-4">Add User</h2>

          <form id="createUserForm" class="space-y-3">
            <input id="newUsername" placeholder="Username" class="w-full border p-2 rounded" required>
            <input id="newDisplayName" placeholder="Name" class="w-full border p-2 rounded">
            <input id="newPassword" type="password" placeholder="Password" class="w-full border p-2 rounded" required>

            <button type="submit" class="w-full bg-[#C76B4A] text-white py-2 rounded">
              Create User
            </button>
          </form>
        </div>

        <div class="bg-white border rounded p-6">
          <h2 class="text-lg font-semibold mb-4">User Management</h2>

          <select id="userSelect" class="w-full border p-2 rounded mb-3"></select>

          <input id="resetPasswordInput" type="password" placeholder="New password"
            class="w-full border p-2 rounded mb-3">

          <button id="resetBtn" class="w-full bg-[#C76B4A] text-white py-2 rounded mb-3">
            Reset Password
          </button>

          <button id="toggleActiveBtn" class="w-full bg-gray-800 text-white py-2 rounded">
            Disable User
          </button>
        </div>

      </div>

    </div>
  </div>

</main>

<script src="auth.js"></script>
<script src="scripts/shared.js"></script>
<script src="scripts/viewer.js"></script>
<script src="scripts/profile.js"></script>

<script>
requireAuth();

let usersCache = [];

async function loadUser() {
  const res = await fetch('/api/me');
  const data = await res.json();

  if (data.loggedIn) {
    document.getElementById('usernameDisplay').textContent =
      data.user.displayName || data.user.username;

    if (data.user.role === 'admin') {
      document.getElementById('tabSettings').classList.remove('hidden');
    }
  }
}

async function loadUsersDropdown() {
  const res = await fetch('/api/users');
  if (!res.ok) return;

  const users = await res.json();
  usersCache = users;

  const select = document.getElementById('userSelect');
  select.innerHTML = '';

  users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.username;
    opt.textContent =
      `${u.displayName} (${u.username})` +
      (u.active === false ? ' [inactive]' : '');
    select.appendChild(opt);
  });

  updateToggleButton();
}

// CREATE USER
document.getElementById('createUserForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const form = document.getElementById('createUserForm');
  const username = document.getElementById('newUsername').value.trim().toLowerCase();
  const displayName = document.getElementById('newDisplayName').value.trim();
  const password = document.getElementById('newPassword').value.trim();

  if (!username || !password) {
    showToast('Username and password are required', 'error');
    return;
  }

  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, displayName, password })
  });

  if (res.ok) {
    showToast('User created');
    form.reset();
    loadUsersDropdown();
  } else {
    const data = await res.json().catch(() => ({}));
    showToast(data.error || 'Create user failed', 'error');
  }
});

function updateToggleButton() {
  const username = document.getElementById('userSelect').value;
  const user = usersCache.find(u => u.username === username);

  const btn = document.getElementById('toggleActiveBtn');

  if (!user) return;

  if (user.active === false) {
    btn.textContent = 'Enable User';
    btn.classList.remove('bg-gray-800');
    btn.classList.add('bg-green-600');
  } else {
    btn.textContent = 'Disable User';
    btn.classList.remove('bg-green-600');
    btn.classList.add('bg-gray-800');
  }
}

document.getElementById('userSelect').addEventListener('change', updateToggleButton);

// RESET PASSWORD
document.getElementById('resetBtn').onclick = async () => {
  const username = document.getElementById('userSelect').value;
  const passwordInput = document.getElementById('resetPasswordInput');

  if (!username || !passwordInput.value) return;

  const res = await fetch('/api/reset-password', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, password: passwordInput.value })
  });

  if (res.ok) {
    showToast('Password updated');
    passwordInput.value = '';
  }
};

// ENABLE / DISABLE
document.getElementById('toggleActiveBtn').onclick = async () => {
  const username = document.getElementById('userSelect').value;
  const user = usersCache.find(u => u.username === username);
  const passwordInput = document.getElementById('resetPasswordInput');

  if (!user) return;

  const isInactive = user.active === false;

  const confirmed = await showConfirm(
    isInactive ? `Enable ${username}?` : `Disable ${username}?`,
    isInactive ? 'Enable' : 'Disable'
  );

  if (!confirmed) return;

  const endpoint = isInactive ? '/api/reactivate-user' : '/api/deactivate-user';

  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username })
  });

  if (res.ok) {
    showToast(isInactive ? 'User enabled' : 'User disabled');
    passwordInput.value = '';
    loadUsersDropdown();
  }
};

function showTab(tab) {
  document.getElementById('contentUploads').classList.add('hidden');
  document.getElementById('contentSettings').classList.add('hidden');

  document.getElementById('content' + capitalize(tab)).classList.remove('hidden');

  if (tab === 'settings') loadUsersDropdown();
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

loadUser();
</script>

</body>
</html>
