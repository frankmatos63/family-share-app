<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Fam Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FAF7F2] flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm border border-[#E8DED2]">


<div class="text-center mb-6">
  <h1 class="text-xl font-semibold">Fam Media</h1>
  <p class="text-sm text-gray-500 mt-1">Sign in</p>
</div>

<form id="loginForm" class="space-y-4">

  <input
    type="text"
    id="username"
    placeholder="Username"
    class="w-full px-4 py-2 border rounded-lg focus:outline-none"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    class="w-full px-4 py-2 border rounded-lg focus:outline-none"
    required
  >

  <button
    type="submit"
    class="w-full bg-[#C76B4A] text-white py-2 rounded-lg"
  >
    Login
  </button>

</form>

<p id="errorMsg" class="text-red-500 text-sm mt-4 hidden text-center">
  Invalid login
</p>


  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/index.html';
        } else {
          errorMsg.classList.remove('hidden');
        }

      } catch (err) {
        console.error(err);
        errorMsg.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
